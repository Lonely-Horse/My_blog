services:
  myblog:
    image: 100.87.250.21:5000/blog_local:latest
    container_name: My_blog
    restart: always
    ports:
      - "8000:8000"
    volumes:
      # 挂载本地的 notes/ 笔记与 posts/ 博客 Markdown 文件夹，使内容更新即时映射进容器，保持容器只读安全
      - ./notes:/usr/local/My_blog/notes:ro
      - ./posts:/usr/local/My_blog/posts:ro
      # 💥 挂载本地的 static/ 静态资源及 templates/ 模板目录，确保宿主机的样式和页面修改能在容器中同步热更新渲染
      - ./static:/usr/local/My_blog/static:ro
      - ./templates:/usr/local/My_blog/templates:ro
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.blog.rule=Host(`blog.ser7`)"
      - "traefik.http.routers.blog.entrypoints=web"
      - "traefik.http.services.my-blog.loadbalancer.server.port=8000"
    networks:
      - gateway_default

networks:
  gateway_default:
    external: true
