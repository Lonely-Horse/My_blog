services:
  myblog:
    build: .
    image: 100.87.250.21:5000/blog_local:latest
    container_name: My_blog
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./notes:/usr/local/My_blog/notes
      - ./posts:/usr/local/My_blog/posts
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz',time=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.blog.rule=Host(`blog.ser7`)"
      - "traefik.http.routers.blog.entrypoints=web"
      - "traefik.http.services.my-blog.loadbalancer.server.port=8000"
    networks:
      - gateway_default

networks:
  gateway_default:
    external: true
